<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Vendeur | Smart Swi9a</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">

    <!-- Perf : Firebase est chargé depuis gstatic -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Importmap complet : storage inclus (utilisé par js/firebase.js) -->
    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js",
            "firebase/storage": "https://www.gstatic.com/firebasejs/11.0.0/firebase-storage.js"
        }
    }
    </script>

    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/vendor-styles.css">

    <!-- Fallback critique (indépendant de vendor-styles.css) -->
    <style>
        /* La modale ne doit jamais apparaître sans .open */
        .v-mobile-overlay:not(.open) { display: none !important; }
        
        /* Fallback minimal pour les bannières si vendor-styles.css échoue */
        .v-banners { display: flex; flex-direction: column; gap: 12px; margin-bottom: 1.5rem; }
        .v-banners:empty { display: none; }
        
        /* Skip link accessible */
        .skip-link {
            position: absolute; left: -9999px; top: 0;
            background: #000; color: #fff; padding: 8px 12px; z-index: 10000;
        }
        .skip-link:focus { left: 8px; top: 8px; }
    </style>

    <script src="/translations.js"></script>
</head>
<body class="vendor-page">

    <a href="#vTabContent" class="skip-link">Aller au contenu principal</a>

    <noscript>
        <div style="background:#fff3cd;border:1px solid #ffeeba;color:#856404;padding:12px;text-align:center;font-family:system-ui,sans-serif;">
            ⚠️ JavaScript est requis pour accéder au tableau de bord vendeur. Merci de l'activer dans votre navigateur.
        </div>
    </noscript>

    <!-- Overlay pour mobile (invisible sans .open) -->
    <div class="v-mobile-overlay" id="vOverlay" aria-hidden="true"></div>

    <main class="v-layout">

        <!-- SIDEBAR -->
        <aside class="v-sidebar" id="vSidebar" aria-label="Navigation vendeur">
            <div class="v-shop-header">
                <h2 class="v-shop-name" id="vShopName" data-i18n="vendor.shop.loading">Chargement...</h2>
                <span class="v-shop-status" id="vShopStatus" data-i18n="vendor.shop.status.pending">⏳ En attente</span>
            </div>

            <nav class="v-nav" role="tablist" aria-label="Onglets du tableau de bord">
                <button class="v-nav-link active" type="button" data-tab="overview" role="tab" aria-selected="true" aria-controls="vTabContent">
                    <span class="v-nav-icon" aria-hidden="true">📊</span>
                    <span class="v-nav-label" data-i18n="vendor.nav.overview">Vue d'ensemble</span>
                </button>
                <button class="v-nav-link" type="button" data-tab="products" role="tab" aria-selected="false" aria-controls="vTabContent">
                    <span class="v-nav-icon" aria-hidden="true">📦</span>
                    <span class="v-nav-label" data-i18n="vendor.nav.products">Mes produits</span>
                </button>
                <button class="v-nav-link" type="button" data-tab="orders" role="tab" aria-selected="false" aria-controls="vTabContent">
                    <span class="v-nav-icon" aria-hidden="true">📋</span>
                    <span class="v-nav-label" data-i18n="vendor.nav.orders">Commandes</span>
                    <span class="v-nav-badge" id="navOrdersBadge" style="display:none;">0</span>
                </button>
                <button class="v-nav-link" type="button" data-tab="wallet" role="tab" aria-selected="false" aria-controls="vTabContent">
                    <span class="v-nav-icon" aria-hidden="true">💰</span>
                    <span class="v-nav-label" data-i18n="vendor.nav.wallet">Mon Wallet</span>
                </button>
                <button class="v-nav-link" type="button" data-tab="stock" role="tab" aria-selected="false" aria-controls="vTabContent">
                    <span class="v-nav-icon" aria-hidden="true">📥</span>
                    <span class="v-nav-label" data-i18n="vendor.nav.stock">Stock Fulfillment</span>
                </button>
            </nav>

            <div class="v-sidebar-help">
                <button class="v-nav-link" type="button" id="logoutBtn">
                    <span class="v-nav-icon" aria-hidden="true">🚪</span>
                    <span class="v-nav-label" data-i18n="vendor.nav.logout">Déconnexion</span>
                </button>
            </div>
        </aside>

        <!-- CONTENU -->
        <div class="v-content">
            <header class="v-header">
                <button class="v-mobile-toggle"
                        type="button"
                        id="vMobileToggle"
                        aria-label="Ouvrir le menu"
                        aria-expanded="false"
                        aria-controls="vSidebar">☰</button>
                <h1 class="v-page-title" id="vPageTitle" data-i18n="vendor.page.overview">Vue d'ensemble</h1>
            </header>

            <!-- Zone de bannières (aria-live pour lecteurs d'écran) -->
            <div id="vBanners" class="v-banners" role="status" aria-live="polite"></div>

            <div class="v-body">
                <!-- Le contenu est injecté ici par vendor-dashboard.js -->
                <div id="vTabContent" role="tabpanel">
                    <div style="text-align:center; padding:3rem;">
                        <div class="spinner" style="margin:0 auto;"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Le script charge les modales dynamiquement -->
    <script type="module" src="/js/vendor-dashboard.js"></script>
</body>
</html>

  /products/stock:
    get:
      tags:
        - Products
      operationId: getProductsStock
      summary: Lister les produits en stock dans l'entrepôt principal
      description: Returns one row per product that currently has free stock in the
        main warehouse. "Free" means the unit is on the shelf and unclaimed —
        not reserved to an order or a transfer, and not held aside as a
        replacement. Products with no free stock are omitted, so every
        `in_stock` is 1 or more. The full list is returned in a single response;
        there is no pagination.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Produits avec du stock libre dans l'entrepôt principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductStockListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /products/locations:
    get:
      tags:
        - Products
      operationId: getProductLocations
      summary: List the emplacements (shelf codes) used in this depot
      description: >-
        Returns the emplacements the depot currently stores something at,
        ordered the way the Produits list orders them, alongside `default_sort`
        (the sort the list opens on) and `order` (the admin's walking route).
        `count` is a number of products, and the `__none__` bucket — the
        products nobody has shelved yet — trails, omitted when empty. These are
        the options of the list's emplacement filter, so they are NOT narrowed
        by that filter: the whole depot's shelves stay pickable.

        An admin gets every emplacement in use rather than one depot's, because
        `product.location` is a single global field and so is the route they
        arrange.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Emplacements in use
        "401":
          $ref: "#/components/responses/Unauthorized"

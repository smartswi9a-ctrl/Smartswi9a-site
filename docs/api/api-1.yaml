tags:
  - name: Auth
    description: Vérifier la clé API
  - name: Orders
    description: Consulter les commandes et mettre à jour leur statut
  - name: Pickups
    description: Planifier et gérer les ramassages de stock
  - name: Products
    description: Parcourir le catalogue de produits (lecture seule)
  - name: Reference
    description: Données de référence — villes desservies et frais de livraison
paths:
  /orders/statuses:
    get:
      tags:
        - Reference
      operationId: listOrderStatuses
      summary: Lister les statuts de commande
      description: Returns every status an order can hold, what each one means, and
        which order fields are required for it. Requires authentication.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Les statuts de commande
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatusListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /orders/receive:
    post:
      tags:
        - Orders
      operationId: receiveOrders
      summary: Réceptionner les commandes scannées dans votre entrepôt
      description: >-
        Prend les étiquettes de commande que votre équipe vient de scanner à
        l'arrivée d'un conteneur et les réceptionne, en un seul appel, dans
        l'entrepôt auquel appartient la clé API. C'est la même opération que le
        scan des commandes dans l'application entrepôt Livo.


        Pour chaque commande envoyée, son stock passe dans votre dépôt. Une fois
        toute la marchandise d'un envoi scannée, le conteneur est marqué comme
        arrivé et les commandes qu'il transportait repassent en `pending` —
        prêtes à partir en livraison depuis chez vous.


        La réponse ne liste que ce qui n'est **pas** entré : tout ce qui est
        absent de `failed_orders` a bien été réceptionné. Renvoyer un lot est
        sans risque — les commandes déjà dans votre stock reviennent en
        `already_received` au lieu d'être scannées deux fois.


        Surveillez `scanned_by_wrong_warehouse` : cette marchandise était
        destinée à un autre dépôt, la commande est donc retirée du circuit de
        livraison. Signalez-les à Livo.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveOrdersRequest"
      responses:
        "202":
          description: Lot traité — un rapport de ce qui a été réceptionné et de ce qui ne
            l'a pas été
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiveOrdersResponse"
        "400":
          $ref: "#/components/responses/OrderReceiveBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/OrderReceiveTooManyRequests"
  /orders:
    get:
      tags:
        - Orders
      operationId: listOrders
      summary: Lister les commandes
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
          description: Filtrer par statut de commande
        - in: query
          name: _limit
          schema:
            type: integer
          description: Nombre maximum de commandes à retourner
        - in: query
          name: _skip
          schema:
            type: integer
          description: Nombre de commandes à ignorer (pagination)
        - in: query
          name: _sort
          schema:
            type: string
          description: Champs de tri, séparés par des espaces et préfixés par +/- (ex.
            "-timestamps.created")
      responses:
        "200":
          description: Liste paginée des commandes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags:
        - Orders
      operationId: createOrder
      summary: Créer une commande
      description: "Crée une nouvelle commande pour le client authentifié. Le
        destinataire est indiqué dans `target`, le montant à encaisser à la
        livraison dans `cost`, et les articles commandés — vos produits
        existants, par identifiant — dans `products`. La commande est créée en
        `draft` ; passez `status: pending` pour la soumettre dans le circuit de
        livraison dès le même appel."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddOrderRequest"
      responses:
        "201":
          description: Commande créée — la nouvelle commande (format allégé destiné aux
            partenaires)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderApiResponse"
        "400":
          $ref: "#/components/responses/OrderCreateBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags:
        - Orders
      operationId: editOrder
      summary: Edit an order, or bulk-move orders to pending
      description: >-
        Overloaded by request body:

        • Provide `id` (plus the fields to change) to edit a **single** order —
        partial updates are supported; which fields are accepted depends on the
        order's current `status` and the caller's role (see `EditOrderRequest`).

        • Provide `orders` (a list of ids) with `status: pending` to move
        **many** orders into `pending` in one call.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: Single order edit

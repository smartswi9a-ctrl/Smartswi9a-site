openapi: 3.0.3
info:
  title: API Entrepôt Livo
  version: 1.0.0
  description: >-
    L'**API Entrepôt Livo** est une interface RESTful serveur-à-serveur destinée
    aux

    opérateurs d'entrepôt qui gèrent la logistique de livraison e-commerce —
    consulter

    les commandes et mettre à jour leur statut, planifier les ramassages de
    stock et

    parcourir le catalogue de produits.


    > Vous développez plutôt une intégration client/vendeur ? Cette API est

    > documentée séparément dans le portail client Livo.


    ## Authentification


    Tous les endpoints, sauf ceux marqués **Reference**, nécessitent une clé API
    émise

    par Livo. Envoyez-la à chaque requête sous forme de jeton bearer :


    ```

    Authorization: Bearer <votre-cle-api>

    ```


    Pour vérifier qu'une clé est valide, appelez `GET /auth/keys` — une réponse

    `200` signifie que la clé fonctionne.


    ## Format des réponses


    Les réponses réussies encapsulent les données dans une enveloppe :


    ```json

    { "success": true, "data": { } }

    ```


    `data` est la ressource pour les endpoints d'élément unique et un tableau
    pour

    les endpoints de liste. Codes de statut : `200` pour les lectures, `201`
    pour

    les créations, `202` pour les mises à jour.


    ## Erreurs


    Les requêtes en échec renvoient un corps JSON décrivant l'erreur :


    ```json

    {
      "success": false,
      "data": {
        "en_message": "Pickup does not exist",
        "fr_message": "Ramassage introuvable",
        "error": "Pickup does not exist",
        "type": "client",
        "details": {}
      }
    }

    ```


    `type` vaut l'une des valeurs suivantes :


    - `client` — entrée invalide ou violation d'une règle métier (400)

    - `prompt` — l'action nécessite une confirmation ; renvoyez-la avec le
      `confirm_text` fourni dans `details` (400)
    - `permission` — clé API absente, invalide ou non autorisée (401/403)

    - `internal` — erreur serveur inattendue (500)


    Chaque endpoint ci-dessous documente ses cas `400` spécifiques avec des

    exemples concrets.


    ## Limite de débit


    Tous les endpoints sont limités à **5 requêtes par seconde** par client.
    Certains endpoints

    ont une limite plus stricte qui leur est propre — le cas échéant, elle est
    indiquée sur

    l'endpoint et renvoyée dans sa réponse `429`.


    ## Pagination


    Les endpoints de liste renvoient au plus **500 éléments** par requête, ce
    qui est aussi la

    valeur par défaut quand `_limit` est omis. Parcourez les ensembles plus
    grands avec

    `_skip` et `_limit`.
  contact:
    name: Livo Integration
    email: integration@livo.ma
servers:
  - url: https://rest.livo.ma
    description: Production
  - url: http://localhost:4000
    description: Local development
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: Clé API émise par Livo.
  schemas:
    AddPickupRequest:
      type: object
      properties:
        client_id:
          type: string
        items:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 500
        products:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: string
              quantity:
                type: number
                format: float
                minimum: 1
            required:
              - product_id
              - quantity
            additionalProperties: false
          minItems: 1
        desired_date:
          type: string
        comment:
          type: string
      required:
        - client_id
      additionalProperties: false
      example:
        client_id: cl-ab12cd34
        items:
          - it-1a2b3c4d
          - it-5e6f7g8h
        desired_date: 25/05/2026
        comment: Morning pickup
    UpdateOrderStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum:
            - pending
        orders:
          type: array
          items:
            type: string
      required:
        - status
        - orders
      additionalProperties: false
      example:
        status: pending
        orders:
          - or-ab12cd34
          - or-ef56gh78
    ReceiveOrdersRequest:
      type: object
      properties:
        order_ids:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          maxItems: 200
          description: Identifiants des commandes à réceptionner dans l'entrepôt appelant.
            Identifiants internes ou votre propre client_order_id.
      required:
        - order_ids
      additionalProperties: false
      example:
        order_ids:
          - or-ab12cd34
          - or-ef56gh78
          - SHOP-4471
    EditPickupRequest:
      type: object
      description: Champs modifiables. Les champs acceptés dépendent du statut actuel
        du ramassage et du rôle de l'appelant.
      properties:
        status:
          type: string
          enum:
            - pending
            - in progress
            - fulfilling
            - fulfilled
            - cancelled
        desired_date:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: string
          description: Identifiants des articles inclus dans le ramassage
        deliverer_id:
          type: string
        comment:
          type: string
      example:
        status: fulfilling
        items:
          - it-1a2b3c4d
          - it-5e6f7g8h
        comment: Two items scanned
    EditOrderRequest:
      type: object
      description: Editable fields for a single order. Send only the fields you want
        to change. Which fields the API will accept depends on the order's
        current status and the caller's role — e.g. `products` can only be
        changed by followup on a non-terminal order, `desired_date` is required
        when transitioning to `reported` or `programmed` and forbidden once the
        order is `cancelled`/`fulfilled`, and `cost` is only editable while the
        order is still `draft` (or by followup pre-terminal).
      properties:
        status:
          type: string
          enum:
            - draft
            - pending
            - in progress
            - fulfilled
            - problem
            - cancelled
            - reported
            - programmed
          description: Status to transition to. The valid transitions depend on the
            order's current status and the caller's role.
        message:
          type: string
          maxLength: 2000
          description: Free-text comment attached to the order (max 2000 chars).
        desired_date:
          type: string
          description: Customer's requested date in DD/MM/YYYY. Required when
            transitioning to `reported` or `programmed`.
        cost:
          type: number
          minimum: 0
          description: Cash to collect on delivery (COD).
        target:
          $ref: "#/components/schemas/Target"
        products:
          type: array
          description: Replace the order's product list. Followup-only, and only while the
            order is non-terminal.
          items:
            type: object
            required:
              - product_id
              - quantity
            properties:
              product_id:
                type: string
                example: pr-ab12cd34
              quantity:
                type: integer
                minimum: 1
                maximum: 99
        deliverer_id:
          type: string
          description: Assign a registered deliverer by user id. admin/followup/warehouse
            only, on `draft`/`pending`/`problem`/`in progress`. Empty string
            clears the assignment on `draft`/`pending`/`problem` (forbidden on
            `in progress` — change status first). On `in progress` orders the
            items currently held by the previous deliverer are reassigned to the
            new one in the same call. Mutually exclusive with `deliverer`.
        deliverer:
          type: object
          description: "Assign an ad-hoc deliverer with just a name and phone — no user
            lookup, no warehouse-match check. Useful for logging an external
            deliverer that doesn't have an account. Same role/status rules as
            `deliverer_id`. Items are not reassigned (an ad-hoc deliverer can't
            physically hold stock in the system). Mutually exclusive with
            `deliverer_id`. `phone` is the gate: a deliverer with no phone is
            silently ignored (the name is dropped) rather than rejected, and the
            rest of the edit still applies."
          required:
            - name
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
              example: Ali Bennani
            phone:
              type: string
              minLength: 1
              maxLength: 40
              example: "+212600000000"
        tags:
          type: array
          items:
            type: string
          description: Free-form lowercase labels. Not editable by the `client` role.
        items:
          type: array
          items:
            type: string
          description: Lock specific stock item ids to this order — only valid when
            transitioning to `fulfilled`.
          maxItems: 500
        pinned:
          type: boolean
      example:
        message: Customer asked to be called before delivery
        desired_date: 27/05/2026
        status: programmed
    AddOrderRequest:
      type: object
      description: "Une nouvelle commande. `cost`, `target` et `products` sont requis.
        La commande est créée en `draft` ; définissez `status: pending` pour la
        soumettre dans le circuit de livraison dès le même appel."
      required:
        - cost
        - target
        - products
      properties:
        cost:
          type: number
          minimum: 0
          description: Montant à encaisser à la livraison (paiement à la livraison)
        target:
          $ref: "#/components/schemas/Target"
        products:
          type: array
          minItems: 1
          maxItems: 99
          description: Les articles commandés — vos produits existants, par identifiant.
          items:
            type: object
            required:
              - product_id
              - quantity
            properties:
              product_id:
                type: string
                example: pr-ab12cd34
              quantity:
                type: integer
                minimum: 1
                maximum: 99
                example: 2
              refr:
                type: string
                description: Le SKU / la référence du client
        desired_date:
          type: string
          description: Date de livraison souhaitée par le client au format JJ/MM/AAAA. Ne
            doit pas être dans le passé.
          example: 10/06/2026
        openable:
          type: boolean
          description: Indique si le client peut ouvrir le colis avant de payer.
        comment:
          type: string
          description: Note en texte libre attachée à la commande lors de sa création.
        status:
          type: string
          enum:
            - draft
            - pending
          description: Statut initial. `draft` par défaut ; utilisez `pending` pour
            soumettre immédiatement la commande dans le circuit de livraison.
        client_order_id:
          type: string
          maxLength: 100
          description: La référence propre du client pour cette commande
      example:
        cost: 250
        target:
          name: Ahmed Bennani
          phone: "0612345678"
          city: casablanca
          address: 12 Rue des Orangers
        products:
          - product_id: pr-ab12cd34
            quantity: 2
        desired_date: 10/06/2026
        status: pending
        client_order_id: SHOP-1042
    Target:
      type: object
      required:
        - name
        - city
        - address
      properties:
        name:
          type: string
          example: Ahmed Bennani
        phone:
          type: string
          example: "+212600000000"
        city:
          type: string
          example: casablanca
        address:
          type: string
          example: 12 Rue des Orangers
    Deliverer:
      type: object
      description: Le livreur assigné à la commande ou au ramassage.
      properties:
        _id:
          type: string
          example: us-xxxxxxxx
        name:
          type: string
          example: Youssef El Amrani
        phone:
          type: string
          example: "+212600000000"
    OrderProduct:
      type: object
      properties:
        product:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
            image:
              type: string
              nullable: true
            refr:
              type: string
        quantity:
          type: integer
          example: 2
    Order:
      type: object
      properties:
        _id:
          type: string
          example: or-xxxxxxxx
        client_order_id:
          type: string
          description: La référence propre du client pour cette commande
        status:
          type: string
          enum:
            - draft
            - pending
            - in progress
            - fulfilled
            - problem
            - cancelled
            - awaiting transfer
            - awaiting pickup
            - reported
            - programmed
        cost:
          type: number
          description: Montant à encaisser à la livraison (paiement à la livraison)
        target:
          $ref: "#/components/schemas/Target"
        products:
          type: array
          items:
            $ref: "#/components/schemas/OrderProduct"
        deliverer:
          allOf:
            - $ref: "#/components/schemas/Deliverer"
          nullable: true
        desired_date:
          type: string
          format: date-time
          nullable: true
        openable:
          type: boolean
        reserved:
          type: boolean
        deleted:
          type: boolean
        return_status:
          type: string
          nullable: true
          enum:
            - returned-pending
            - returned-started
            - returned-warehouse
            - returned-fully
        timestamps:
          type: object
          properties:
            created:
              type: string
              format: date-time
            updated:
              type: string
              format: date-time
    ApiOrder:
      type: object
      description: Slim order confirmation returned to API-key callers from create and
        edit. The full order document is returned only to the web app.
      properties:
        _id:
          type: string
          example: or-xxxxxxxx
          description: Livo order / tracking id
        client_order_id:
          type: string
          nullable: true
          description: La référence propre du client pour cette commande
        status:
          type: string
          enum:
            - draft
            - pending
            - in progress
            - fulfilled
            - problem
            - cancelled
            - awaiting transfer
            - awaiting pickup
            - reported
            - programmed
        return_status:
          type: string
          nullable: true
          enum:
            - returned-pending
            - returned-started
            - returned-warehouse
            - returned-fully
        cost:
          type: number
          description: Montant à encaisser à la livraison (paiement à la livraison)
        desired_date:
          type: string
          nullable: true
          description: Requested delivery date, formatted dd/mm/yyyy
          example: 10/06/2026
        target:
          type: object
          nullable: true
          properties:
            name:
              type: string
              example: Ahmed Bennani
            phone:
              type: string
              example: "+212600000000"
            city:
              type: string
              example: casablanca
        products:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              quantity:
                type: integer
                example: 2
              refr:
                type: string
                nullable: true
                description: Le SKU / la référence du client
        deliverer:
          type: object
          nullable: true
          description: The assigned deliverer; null until one is assigned.
          properties:
            name:
              type: string
              example: Youssef El Amrani
            phone:
              type: string
              example: "+212600000000"
        api_version:
          type: integer
        timestamps:
          type: object
          properties:
            created:
              type: string
              format: date-time
            updated:
              type: string
              format: date-time
    OrderStatus:
      type: object
      description: Un statut de commande avec sa signification et les champs de
        commande dont il a besoin.
      properties:
        value:
          type: string
          description: La valeur de statut utilisée dans l'API
          example: reported
        label:
          type: string
          example: Reported
        description:
          type: string
        requires:
          type: array
          items:
            type: string
          description: Champs de commande qui doivent être renseignés pour ce statut
          example:
            - desired_date
        optional:
          type: array
          items:
            type: string
          description: Champs de commande pouvant être renseignés de façon facultative
            pour ce statut
          example:
            - message
    Pickup:
      type: object
      properties:
        _id:
          type: string
          example: pi-xxxxxxxx
        status:
          type: string
          enum:
            - pending
            - in progress
            - fulfilling
            - fulfilled
            - problem
            - cancelled
        type:
          type: string
          enum:
            - free
            - paid
        target:
          type: object
          nullable: true
          properties:
            name:
              type: string
              example: Ahmed Bennani
            phone:
              type: string
              example: "+212600000000"
            address:
              type: string
              example: 12 Rue des Orangers
        products:
          type: array
          items:
            $ref: "#/components/schemas/OrderProduct"
        deliverer:
          allOf:
            - $ref: "#/components/schemas/Deliverer"
          nullable: true
        desired_date:
          type: string
          format: date-time
          nullable: true
        items_count:
          type: integer
          nullable: true
        needs_packaging:
          type: boolean
        packaging_type:
          type: string
          nullable: true
        deleted:
          type: boolean
        timestamps:
          type: object
          properties:
            created:
              type: string
              format: date-time
            updated:
              type: string
              format: date-time
    Product:
      type: object
      properties:
        _id:
          type: string
          example: pr-xxxxxxxx
        id_name:
          type: string
          description: Nom en minuscules utilisé comme clé de recherche
        name:
          type: string
        refr:
          type: string
          description: Le SKU / la référence du client
        price:
          type: number
        image:
          type: string
          nullable: true
        transfer_back:
          type: boolean
        deleted:
          type: boolean
        timestamps:
          type: object
          properties:
            created:
              type: string
              format: date-time
    ProductStock:
      type: object
      properties:
        _id:
          type: string
          example: pr-xxxxxxxx
        name:
          type: string
          example: Serum X
        refr:
          type: string
          description: Le SKU / la référence du client
        in_stock:
          type: integer
          example: 42
          description: Unités disponibles dans l'entrepôt principal et non réservées — ni
            à une commande, ni à un transfert, et non conservées comme
            remplacement. Toujours 1 ou plus.
    City:
      type: object
      properties:
        _id:
          type: string
          example: ci-xxxxxxxx
        name:
          type: string
          example: casablanca
        hasItems:
          type: boolean
          description: Indique si la ville détient actuellement du stock
        isMainCity:
          type: boolean
        mainCity:
          type: string
          description: La ville-pôle à laquelle cette ville est rattachée
        canTransferOut:
          type: boolean
        canTransferIn:
          type: boolean
        canPickup:
          type: boolean
          description: Indique si des ramassages peuvent être planifiés depuis cette ville
        canOrder:
          type: boolean
          description: Indique si des commandes peuvent être livrées dans cette ville
        warehouseComment:
          type: string
        orderCutoffHour:
          type: number
          nullable: true
          example: 21.5
          description: Morocco-time hour (minutes as a fraction, 21.5 = 21:30) after which
            a new order for this city leaves the next working day. null when no
            cutoff is set.
    Fees:
      type: object
      description: La grille publique des frais de livraison.
      properties:
        request_date:
          type: string
          description: Date de génération de la grille
        order_fees:
          type: array
          description: Frais de livraison par ville
          items:
            type: object
            properties:
              city:
                type: string
                example: casablanca
              fee:
                type: number
                example: 40
    ApiKey:
      type: object
      properties:
        _id:
          type: string
          example: ap-xxxxxxxx
        key:
          type: string
          description: Le jeton bearer. Affiché en entier uniquement à la création.
        label:
          type: string
        date_created:
          type: string
          format: date-time
    ReceiveOrdersResult:
      type: object
      description: Résultat d'un scan de réception groupé. Seules les commandes qui
        n'ont PAS été réceptionnées sont listées — tout ce qui est absent de
        `failed_orders` est bien entré. `total` = `received` + `failed`.
      properties:
        total:
          type: integer
          description: Identifiants de commande envoyés
          example: 3
        received:
          type: integer
          description: Commandes entrées dans votre stock
          example: 1
        failed:
          type: integer
          description: Commandes non réceptionnées
          example: 2
        failed_orders:
          type: array
          description: Une entrée par commande non réceptionnée.
          items:
            type: object
            properties:
              order_id:
                type: string
                description: L'identifiant exactement tel que vous l'avez envoyé
                example: or-ab12cd34
              verdict:
                type: string
                enum:
                  - already_received
                  - not_found
                  - no_items
                  - scanned_by_wrong_warehouse
                  - failed
                description: "`already_received` — la commande est déjà dans votre stock ;
                  renvoyer un lot est sans risque et remonte ce verdict plutôt
                  qu'une erreur. `not_found` — aucune commande ne correspond à
                  cet identifiant. `no_items` — la commande existe mais n'a
                  aucun stock à remettre. `scanned_by_wrong_warehouse` — la
                  marchandise était destinée à un autre dépôt. `failed` — le
                  scan a été refusé ; voir `message`."
              message:
                type: string
                description: Pourquoi l'échec. Présent sur `scanned_by_wrong_warehouse` et
                  `failed`.
                example: Scanné dans le mauvais dépôt, signalez-le à Livo
      example:
        total: 3
        received: 1
        failed: 2
        failed_orders:
          - order_id: or-ab12cd34
            verdict: already_received
          - order_id: SHOP-4471
            verdict: scanned_by_wrong_warehouse
            message: Scanné dans le mauvais dépôt, signalez-le à Livo
    ErrorEnvelope:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          properties:
            en_message:
              type: string
              description: Message lisible (anglais)
            fr_message:
              type: string
              description: Message lisible (français)
            error:
              type: string
              description: Alias de en_message
            type:
              type: string
              enum:
                - client
                - prompt
                - permission
                - internal
              description: client = entrée invalide ou violation d'une règle métier ; prompt =
                l'action nécessite une confirmation (voir details.confirm_text)
                ; permission = échec d'authentification/autorisation ; internal
                = erreur serveur inattendue
            details:
              type: object
              description: Contexte supplémentaire. Pour les erreurs de type `prompt`,
                contient `confirm_text`.
    GenericOkResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            data:
              type: object
    OrderResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            data:
              $ref: "#/components/schemas/Order"
    OrderApiResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            data:
              $ref: "#/components/schemas/ApiOrder"
    OrderListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Order"
    OrderStatusListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/OrderStatus"
    PickupResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            data:
              $ref: "#/components/schemas/Pickup"
    PickupListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Pickup"
    ProductResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:

<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation du mot de passe | Smartswika</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f8f6f2">
    <!-- ✅ FIX DARK MODE — force le mode clair uniquement -->
    <meta name="color-scheme" content="only light">
    <meta name="supported-color-schemes" content="light">

    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js"
        }
    }
    </script>

    <link rel="stylesheet" href="/css/style.c422eb25.css">
    <link rel="stylesheet" href="/css/style-patches.1bd4b588.css">
    <script src="/translations.js"></script>

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 1rem;
            margin: 0;
            background: var(--bg);
        }
        .reset-card {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: var(--radius-lg);
            padding: 2rem;
            max-width: 450px;
            width: 100%;
            box-shadow: var(--shadow-lg);
        }
        .reset-card h1 {
            text-align: center;
            color: var(--gold);
            font-family: var(--font-secondary);
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }
        .reset-card input {
            width: 100%;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-surface);
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
        }
        .reset-card input:focus {
            border-color: var(--gold);
            outline: none;
        }
        .reset-card .btn-submit {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, var(--gold), #7d5a1d);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all var(--transition-spring);
        }
        .reset-card .btn-submit:hover {
            transform: scale(1.02);
            box-shadow: var(--shadow-gold);
        }
        .reset-card .msg {
            font-size: 0.85rem;
            margin-bottom: 0.8rem;
            text-align: center;
            min-height: 1.2rem;
        }
        .reset-logo {
            text-align: center;
            font-family: var(--font-secondary);
            color: var(--gold);
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="reset-card">
        <div class="reset-logo">SMARTSWIKA</div>
        <h1 data-key="resetPassword">🔑 Réinitialiser le mot de passe</h1>
        <div id="resetMsg" class="msg"></div>
        <form id="resetForm">
            <input type="password" id="newPass" data-key="newPassword" placeholder="Nouveau mot de passe (min. 6 caractères)" autocomplete="new-password">
            <input type="password" id="confirmPass" data-key="confirmPassword" placeholder="Confirmer le mot de passe" autocomplete="new-password">
            <button type="submit" id="resetBtn" class="btn-submit" data-key="resetPassword">✅ Réinitialiser</button>
        </form>
        <p style="text-align:center;margin-top:1rem;font-size:0.8rem;">
            <a href="/" style="color:var(--gold);" data-key="productBreadcrumbHome">← Retour à l'accueil</a>
        </p>
    </div>

    <script type="module">
        import { confirmPasswordReset, verifyPasswordResetCode } from "firebase/auth";
        import { auth } from "/js/firebase.js";
        import { initLang, t } from "/js/utils.js";
        import { applyTranslations } from "/js/events.js";

        document.addEventListener('DOMContentLoaded', () => {
            initLang();
            applyTranslations();
        });

        const urlParams = new URLSearchParams(window.location.search);
        const oobCode = urlParams.get('oobCode');
        const msg = document.getElementById('resetMsg');
        const form = document.getElementById('resetForm');

        if (!oobCode) {
            msg.textContent = '⚠️ ' + t('otpInvalid');
            msg.style.color = 'var(--danger)';
            form.style.display = 'none';
        } else {
            verifyPasswordResetCode(auth, oobCode).then(email => {
                msg.textContent = '✅ ' + email;
                msg.style.color = 'var(--success)';

                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const newPass = document.getElementById('newPass').value;
                    const confirmPass = document.getElementById('confirmPass').value;

                    if (newPass !== confirmPass) {
                        msg.textContent = '⚠️ ' + t('passwordMismatch');
                        msg.style.color = 'var(--danger)';
                        return;
                    }
                    if (newPass.length < 6) {
                        msg.textContent = '⚠️ ' + t('passwordTooShort');
                        msg.style.color = 'var(--danger)';
                        return;
                    }

                    try {
                        await confirmPasswordReset(auth, oobCode, newPass);
                        msg.textContent = '✅ ' + t('success');
                        msg.style.color = 'var(--success)';
                        setTimeout(() => { window.location.href = '/'; }, 2000);
                    } catch (err) {
                        msg.textContent = '⚠️ ' + t('error') + ' : ' + err.message;
                        msg.style.color = 'var(--danger)';
                    }
                });
            }).catch(err => {
                msg.textContent = '⚠️ ' + t('otpExpired');
                msg.style.color = 'var(--danger)';
                form.style.display = 'none';
            });
        }
    </script>
</body>
</html>

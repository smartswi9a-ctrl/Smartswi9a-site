    <script type="importmap">

            "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js",

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 1rem;
            margin: 0;
            background: var(--bg);
        }
        .reset-card {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: var(--radius-lg);
            padding: 2rem;
            max-width: 450px;
            width: 100%;
            box-shadow: var(--shadow-lg);
        }
        .reset-card h1 {
            text-align: center;
            color: var(--gold);
            font-family: var(--font-secondary);
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }
        .reset-card input {
            width: 100%;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-surface);
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
        }
        .reset-card input:focus {
            border-color: var(--gold);
            outline: none;
        }
        .reset-card .btn-submit {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, var(--gold), #7d5a1d);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all var(--transition-spring);
        }
        .reset-card .btn-submit:hover {
            transform: scale(1.02);
            box-shadow: var(--shadow-gold);
        }
        .reset-card .msg {
            font-size: 0.85rem;
            margin-bottom: 0.8rem;
            text-align: center;
            min-height: 1.2rem;
        }
        .reset-logo {
            text-align: center;
            font-family: var(--font-secondary);
            color: var(--gold);
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            font-weight: 700;
        }
        .error-lang-bar {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 10;
        }
        .error-lang-bar select {
            padding: 0.5rem 0.7rem;
            border: 1px solid var(--border-gold);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text);
            font: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
        .error-lang-bar select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(165, 123, 46, 0.14);
        }
        [dir="rtl"] .error-lang-bar { right: auto; left: 1rem; }
    </style>
</head>
<body>
    <div class="error-lang-bar">
        <select id="langSelect" data-aria-key="ariaLangChange" aria-label="Changer la langue">
            <option value="ar">AR</option>
            <option value="fr" selected>FR</option>
            <option value="en">EN</option>
        </select>
    </div>
    <div class="reset-card">
        <div class="reset-logo">SMARTSWIKA</div>
        <h1 data-key="resetPassword">🔑 Réinitialiser le mot de passe</h1>
        <div id="resetMsg" class="msg"></div>
        <form id="resetForm">
            <input type="password" id="newPass" data-key="newPassword" placeholder="Nouveau mot de passe (min. 6 caractères)" autocomplete="new-password">
            <input type="password" id="confirmPass" data-key="confirmPassword" placeholder="Confirmer le mot de passe" autocomplete="new-password">
            <button type="submit" id="resetBtn" class="btn-submit" data-key="resetPassword">✅ Réinitialiser</button>
        </form>
        <p style="text-align:center;margin-top:1rem;font-size:0.8rem;">
            <a href="/" style="color:var(--gold);" data-key="productBreadcrumbHome">← Retour à l'accueil</a>
        </p>
    </div>

    <script type="module">
        import { confirmPasswordReset, verifyPasswordResetCode } from "firebase/auth";
        import { auth } from "/js/firebase.js";
        import { t } from "/js/utils.js";
        import { initLangToggle } from "/js/lang-toggle.js";

        initLangToggle();

        const urlParams = new URLSearchParams(window.location.search);
        const oobCode = urlParams.get('oobCode');
        const msg = document.getElementById('resetMsg');
        const form = document.getElementById('resetForm');

        /* Les messages de statut sont ré-appliqués au changement de langue. */
        let statusKind = null;
        let statusKey = null;

        function setStatus(kind, text, key) {
            statusKind = kind;
            statusKey = key || null;
            msg.textContent = text;
            msg.style.color = kind === 'error' ? 'var(--danger)' : 'var(--success)';
        }

        window.__onLangChange = () => {
            if (!statusKind || !statusKey) return;
            const mark = statusKind === 'error' ? '⚠️ ' : '✅ ';
            setStatus(statusKind, mark + t(statusKey), statusKey);
        };

        if (!oobCode) {
            setStatus('error', '⚠️ ' + t('otpInvalid'), 'otpInvalid');
            form.style.display = 'none';
        } else {
            verifyPasswordResetCode(auth, oobCode).then(email => {
                /* L'e-mail confirmé est figé : pas de clé de traduction. */
                setStatus('success', '✅ ' + email, null);

                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const newPass = document.getElementById('newPass').value;
                    const confirmPass = document.getElementById('confirmPass').value;

                    if (newPass !== confirmPass) {
                        setStatus('error', '⚠️ ' + t('passwordMismatch'), 'passwordMismatch');
                        return;
                    }
                    if (newPass.length < 6) {
                        setStatus('error', '⚠️ ' + t('passwordTooShort'), 'passwordTooShort');
                        return;
                    }

                    try {
                        await confirmPasswordReset(auth, oobCode, newPass);
                        setStatus('success', '✅ ' + t('success'), 'success');
                        setTimeout(() => { window.location.href = '/'; }, 2000);
                    } catch (err) {
                        setStatus('error', '⚠️ ' + t('error') + ' : ' + err.message, null);
                    }
                });
            }).catch(err => {
                setStatus('error', '⚠️ ' + t('otpExpired'), 'otpExpired');
                form.style.display = 'none';
            });
        }
    </script>

name: Smart Swi9a security and syntax checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/smartswi9a-global-audit-2026-11-05]

jobs:
  static-and-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21 for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Cloud Functions syntax
        run: node --check functions/index.js

      - name: Check browser modules and Worker syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in js/*.js cloudflare/workers/*.js; do
            node --input-type=module --check < "$file"
          done

      - name: Validate Firebase JSON configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('functions/package.json','utf8'))"

      - name: Test vendor architecture consistency
        run: node tests/vendor-architecture.test.cjs

      - name: Install Firebase CLI and rules test dependencies
        run: |
          npm install --global firebase-tools
          npm install --no-save firebase @firebase/rules-unit-testing

      - name: Test Firestore and Storage rules in emulators
        run: firebase emulators:exec --only firestore,storage --project demo-smart-swi9a "node tests/rules.test.cjs"

  # ------------------------------------------------------------------
  # npm-audit : SUIVI NON BLOQUANT, jamais un gate CI.
  #
  # Etat au moment de l'ajout : 8 vulnerabilites de severite moderate,
  # toutes TRANSITIVES. Chaine :
  #   firebase-admin -> @google-cloud/firestore / @google-cloud/storage
  #   -> google-gax / gaxios / teeny-request / retry-request -> uuid < 11.1.1
  # (GHSA-w5hq-g745-h8pq : bounds check manquant sur uuid v3/v5/v6).
  #
  # `npm audit fix` est un no-op ; le seul correctif est
  # `npm audit fix --force`, qui installerait firebase-admin@14 : changement
  # majeur, non teste. On ne l'applique donc pas.
  #
  # continue-on-error: true => une alerte ne bloque ni ne fait echouer la PR.
  # Le rapport reste archive dans le resume du run (GITHUB_STEP_SUMMARY).
  # ------------------------------------------------------------------
  npm-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Source unique de verite, partagee avec les postes de dev.
          node-version-file: .nvmrc

      - name: Audit dependencies (informational)
        working-directory: functions
        shell: bash
        run: |
          set +e
          # --package-lock-only : audite le lockfile sans installer node_modules.
          # `tee` conserve le rapport complet dans le resume du run.
          npm audit --package-lock-only --audit-level=moderate 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          {
            echo ""
            if [ "$status" -eq 0 ]; then
              echo "**Resultat :** aucune vulnerabilite de niveau moderate ou superieur."
            else
              echo "**Resultat :** vulnerabilites detectees (voir rapport ci-dessus)."
              echo ""
              echo "Suivi non bloquant. Ne pas appliquer npm audit fix --force :"
              echo "cela installerait firebase-admin@14, un changement majeur non teste."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
